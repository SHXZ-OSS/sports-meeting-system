<svg width="256px" height="256px" viewBox="0 0 256 256" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <title>Favicon</title>
    <defs>
        <linearGradient x1="50%" y1="0%" x2="50%" y2="100%" id="bg-gradient">
            <stop stop-color="#2B32B2" offset="0%"></stop>
            <stop stop-color="#1488CC" offset="100%"></stop>
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
            <feOffset dx="0" dy="2" result="offsetblur"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.3"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <g id="Page-1" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <rect id="Container" fill="url(#bg-gradient)" x="16" y="16" width="224" height="224" rx="40"></rect>
        
        <g id="Icon-Content" transform="translate(58.000000, 68.000000)" fill="#FFFFFF">
            
            <g id="Chart-Bars" filter="url(#shadow)">
