            </g>
            
            <path d="M125,40 L145,40" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6"></path>
            <path d="M130,55 L155,55" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.8"></path>
            <path d="M120,70 L140,70" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.4"></path>
