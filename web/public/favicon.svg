                <rect x="35" y="30" width="25" height="90" rx="4"></rect>
                <rect x="70" y="0" width="25" height="120" rx="4"></rect>
            </g>

            <g id="Runner" transform="translate(85.000000, 15.000000)" filter="url(#shadow)">
